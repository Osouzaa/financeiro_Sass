name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Valores fictícios: a CI não conecta no banco, só compila e testa
      DATABASE_URL: sqlserver://localhost:1433;database=ci
      JWT_ACCESS_SECRET: segredo-apenas-para-a-ci-com-mais-de-32-caracteres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
